name: ML Training & Promotion Pipeline

on:
  # Esecuzione manuale da tab "Actions" con parametri custom.
  workflow_dispatch:
    inputs:
      league:
        description: "Lega da filtrare (default Serie A — vedi MLConfig.league_name)"
        required: false
        default: "Serie A"

      tune:
        description: "Esegui RandomizedSearchCV (più lento, più preciso)"
        type: boolean
        default: true

      tune_iter:
        description: "Numero di combinazioni RandomizedSearchCV"
        required: false
        default: "120"

      clusters:
        description: "Numero di cluster K-Medoids (-1 = auto via silhouette)"
        required: false
        default: "-1"

      predict_next:
        description: "Ri-fit su tutti i dati e predici prossima stagione"
        type: boolean
        default: true

      evaluate_mantra:
        description: "Esegui valutazione MANTRA dopo il training"
        type: boolean
        default: false

      test_seasons:
        description: "Stagioni di test (hold-out più recenti)"
        required: false
        default: "1"

      min_minutes:
        description: "Minuti minimi per includere un giocatore (MLConfig.min_minutes)"
        required: false
        default: "800"

      seed:
        description: "Random seed per riproducibilità"
        required: false
        default: "42"

      log_level:
        description: "Livello di logging"
        required: false
        default: "INFO"

      output_dir:
        description: "Directory artefatti (vuoto = default /app/artifacts)"
        required: false
        default: ""

      # Se lasciato vuoto → scarica automaticamente fantavoto_real.csv da R2
      # e lo passa come --fantavoto-csv /app/artifacts/fantavoto_real.csv
      fantavoto_csv:
        description: "Path al CSV fantavoto nel container (vuoto = download automatico da R2)"
        required: false
        default: ""

      # WS14 — Flag da promuovere al termine della pipeline. Vuoto = nessuna promozione.
      promote_flag:
        description: >
          Feature flag da promuovere (vuoto = no promote). Se valorizzato, al
          termine della pipeline il flag viene portato a SHADOW, osservato, e
          poi promosso ad ACTIVE solo se il promotion gate passa. Valori ammessi:
          enable_limited_sample_training, enable_shrinkage,
          enable_recent_role_features, enable_breakout_model.
        required: false
        default: ""

      # WS14 — Quota di traffico ACTIVE finale (0-100, default 100).
      promote_rollout_pct:
        description: "Quota di traffico finale ACTIVE (0-100, default 100)"
        required: false
        default: "100"

      # WS14 — Path al promotion_report.json (deve essere già stato prodotto
      # da ml-experiments.yml oppure passato come artifact esterno). Se vuoto
      # la pipeline usa quello più recente in artifacts/experiments.
      promotion_report:
        description: "Path al promotion_report.json (vuoto = cerca in artifacts/experiments)"
        required: false
        default: ""

      # WS14 — Periodo di osservazione SHADOW (in minuti) prima del gate finale.
      observe_minutes:
        description: "Minuti di osservazione SHADOW prima del promotion gate finale"
        required: false
        default: "5"

  # Schedulazione: ogni lunedì alle 06:00 UTC (~08:00 CEST)
  # schedule:
  #   - cron: "0 6 * * 1"

# Evita run sovrapposte se ne parte una manuale mentre gira quella schedulata.
concurrency:
  group: ml-training
  cancel-in-progress: false

# Variabili condivise a livello di workflow (env sezione per job).
env:
  ML_R2_BUCKET_NAME: ${{ secrets.ML_R2_BUCKET_NAME || 'baudo-spoon-ml-artifacts' }}
  # Nome del file di stato: source of truth per il rollout.
  R2_ROLLOUT_STATE: rollout/state.json
  # Path standard per gli artefatti obbligatori (plan §16.1).
  ARTIFACT_EFFECTIVE_CONFIG: artifacts/effective_config.json
  ARTIFACT_PROMOTION_REPORT: artifacts/promotion_report.json
  ARTIFACT_SHADOW_COMPARISON: artifacts/shadow_comparison.json
  ARTIFACT_CANARY_REPORT: artifacts/canary_report.json
  ARTIFACT_TEST_SUMMARY: artifacts/test_summary.json

jobs:
  # ── FASE 1: Build (obbligatorio) ─────────────────────────────────────
  build:
    name: "Phase 1 — Build"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      active_flags: ${{ steps.rollout_env.outputs.ACTIVE_FLAGS }}
      shadow_flags: ${{ steps.rollout_env.outputs.SHADOW_FLAGS }}
      mode_flags: ${{ steps.rollout_env.outputs.MODE_FLAGS }}
      promotion_report_resolved: ${{ steps.resolve_promotion_report.outputs.path }}
    env:
      ML_DATABASE_URL: ${{ secrets.ML_DATABASE_URL }}
      ML_R2_ENDPOINT_URL: ${{ secrets.ML_R2_ENDPOINT_URL }}
      ML_R2_ACCESS_KEY_ID: ${{ secrets.ML_R2_ACCESS_KEY_ID }}
      ML_R2_SECRET_ACCESS_KEY: ${{ secrets.ML_R2_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          missing=0
          for var in ML_DATABASE_URL ML_R2_ENDPOINT_URL ML_R2_ACCESS_KEY_ID ML_R2_SECRET_ACCESS_KEY; do
            if [ -z "${!var}" ]; then
              echo "::error::Secret $var is not set"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "All required secrets are present."

      # ── Rollout state (PR8 + production-hardening WS3) ─────────────
      # Scarica lo stato dei feature flag da R2 (scritto da ml-rollout.yml) e
      # traduce gli stage in env vars con semantica corretta:
      #   DISABLED → nessuna env (legacy)
      #   SHADOW   → *_CHALLENGER=true (compute only, production unchanged)
      #   ACTIVE   → flag=true (production uses challenger)
      # Se lo stato non esiste (primo run), tutti i flag restano DISABLED.
      - name: Install jq (for rollout state parsing)
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq jq
          fi
          jq --version

      - name: Read rollout state from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ML_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ML_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          mkdir -p artifacts/rollout
          echo "Downloading s3://${ML_R2_BUCKET_NAME}/${R2_ROLLOUT_STATE} ..."
          if aws s3 cp \
              "s3://${ML_R2_BUCKET_NAME}/${R2_ROLLOUT_STATE}" \
              artifacts/rollout/state.json \
              --endpoint-url "${ML_R2_ENDPOINT_URL}" 2>/dev/null; then
            echo "Rollout state scaricato:"
            cat artifacts/rollout/state.json
          else
            echo "::notice::Nessun rollout state in R2 → tutti i flag DISABLED (legacy behaviour)."
            echo '{"version":1,"flags":{},"audit":[]}' > artifacts/rollout/state.json
          fi

      - name: Translate rollout state to env vars
        id: rollout_env
        run: |
          if [ ! -f artifacts/rollout/state.json ]; then
            echo "No rollout state → all flags DISABLED"
            echo "ACTIVE_FLAGS=" >> "$GITHUB_OUTPUT"
            echo "SHADOW_FLAGS=" >> "$GITHUB_OUTPUT"
            echo "MODE_FLAGS=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ACTIVE_FLAGS=$(jq -r '
            .flags | to_entries[]
            | select(.value.stage == "active")
            | .key
          ' artifacts/rollout/state.json)
          SHADOW_FLAGS=$(jq -r '
            .flags | to_entries[]
            | select(.value.stage == "shadow")
            | .key
          ' artifacts/rollout/state.json)
          MODE_FLAGS=$(jq -r '
            .flags | to_entries[]
            | select(.value.stage == "active" or .value.stage == "shadow")
            | select(.key == "reliability_weight_mode")
            | "\(.key)=\(.value.mode // .value.value // "bucket")"
          ' artifacts/rollout/state.json 2>/dev/null || true)

          echo "ACTIVE flags (production path):"
          echo "${ACTIVE_FLAGS:-<none>}"
          echo "SHADOW flags (challenger only):"
          echo "${SHADOW_FLAGS:-<none>}"
          echo "Mode flags:"
          echo "${MODE_FLAGS:-<none>}"

          {
            echo "ACTIVE_FLAGS<<EOF"
            echo "${ACTIVE_FLAGS}"
            echo "EOF"
            echo "SHADOW_FLAGS<<EOF"
            echo "${SHADOW_FLAGS}"
            echo "EOF"
            echo "MODE_FLAGS<<EOF"
            echo "${MODE_FLAGS}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve promotion report path
        id: resolve_promotion_report
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ML_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ML_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          # Se l'utente ha passato un path custom, quello vince.
          if [ -n "${{ github.event.inputs.promotion_report }}" ]; then
            mkdir -p artifacts
            cp "${{ github.event.inputs.promotion_report }}" "$ARTIFACT_PROMOTION_REPORT"
            echo "path=$ARTIFACT_PROMOTION_REPORT" >> "$GITHUB_OUTPUT"
            echo "::notice::Using user-supplied promotion report: ${{ github.event.inputs.promotion_report }}"
            exit 0
          fi

          # Altrimenti: cerca l'ultimo report in artifacts/experiments.
          if [ -d artifacts/experiments ]; then
            LATEST=$(find artifacts/experiments -name 'report.json' -type f 2>/dev/null | sort | tail -n 1 || true)
            if [ -n "${LATEST}" ] && [ -f "${LATEST}" ]; then
              mkdir -p "$(dirname "$ARTIFACT_PROMOTION_REPORT")"
              cp "${LATEST}" "$ARTIFACT_PROMOTION_REPORT"
              echo "path=$ARTIFACT_PROMOTION_REPORT" >> "$GITHUB_OUTPUT"
              echo "::notice::Reusing local promotion report: ${LATEST}"
              exit 0
            fi
          fi

          # Altrimenti: scarica l'ultimo artifact "ml-experiments-report" da R2.
          # (Best-effort: serve per garantire un promotion report anche
          # quando experiments e training girano in run separati.)
          echo "::warning::Nessun promotion report locale; scarico l'ultimo da R2..."
          R2_REPORTS_PREFIX="experiments/"
          TMP_LIST=$(mktemp)
          if aws s3 ls \
              "s3://${ML_R2_BUCKET_NAME}/${R2_REPORTS_PREFIX}" \
              --endpoint-url "${ML_R2_ENDPOINT_URL}" \
              --recursive > "${TMP_LIST}" 2>/dev/null; then
            LATEST_KEY=$(grep '/report\.json$' "${TMP_LIST}" | sort | tail -n 1 | awk '{print $4}' || true)
            if [ -n "${LATEST_KEY}" ]; then
              mkdir -p "$(dirname "$ARTIFACT_PROMOTION_REPORT")"
              if aws s3 cp \
                  "s3://${ML_R2_BUCKET_NAME}/${LATEST_KEY}" \
                  "$ARTIFACT_PROMOTION_REPORT" \
                  --endpoint-url "${ML_R2_ENDPOINT_URL}"; then
                echo "path=$ARTIFACT_PROMOTION_REPORT" >> "$GITHUB_OUTPUT"
                echo "::notice::Downloaded promotion report: ${LATEST_KEY}"
                rm -f "${TMP_LIST}"
                exit 0
              fi
            fi
          fi
          rm -f "${TMP_LIST}"

          # Nessun report trovato: segnala all'utente e procedi (i job
          # successivi che richiedono il report falliranno se è davvero mancante).
          echo "::warning::Nessun promotion_report.json disponibile. I job validate-promotion-report e promote-to-active falliranno se non ne fornisci uno."
          echo "path=" >> "$GITHUB_OUTPUT"

      # Scarica fantavoto_real.csv da R2 se l'utente non ha passato un path custom.
      - name: Download fantavoto_real.csv from R2
        if: ${{ github.event.inputs.fantavoto_csv == '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ML_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ML_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          mkdir -p artifacts
          echo "Downloading s3://${ML_R2_BUCKET_NAME}/fantavoto_real.csv ..."
          if ! command -v aws >/dev/null 2>&1; then
            pip install --quiet awscli
          fi
          aws s3 cp \
            "s3://${ML_R2_BUCKET_NAME}/fantavoto_real.csv" \
            artifacts/fantavoto_real.csv \
            --endpoint-url "${ML_R2_ENDPOINT_URL}"

          if [ ! -s artifacts/fantavoto_real.csv ]; then
            echo "::error::Downloaded fantavoto_real.csv is missing or empty"
            exit 1
          fi

          echo "Downloaded OK:"
          ls -lh artifacts/fantavoto_real.csv
          echo "--- header ---"
          head -3 artifacts/fantavoto_real.csv

      - name: Build ML image
        run: docker build -f ml/Dockerfile -t ml-runner:latest .

      - name: Upload build outputs (rollout state, promotion report, fantavoto)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/rollout/
            artifacts/fantavoto_real.csv
            ${{ env.ARTIFACT_PROMOTION_REPORT }}
          if-no-files-found: warn
          retention-days: 30

  # ── FASE 2-4: Test suite (unit / integration / e2e) ─────────────────
  # Tutti e 3 i job dipendono SOLO da build e sono indipendenti fra loro.
  # Vengono lanciati in parallelo; train richiede il successo di tutti.

  unit-tests:
    name: "Phase 2 — Unit tests"
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq jq
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ml-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/

      - name: Build ML image (per dipendenze)
        run: docker build -f ml/Dockerfile -t ml-runner:latest .

      - name: Run unit tests
        run: |
          mkdir -p artifacts
          # Unit test = test rapidi, no integration markers, no e2e markers,
          # no markers "slow".  Escludiamo esplicitamente i test che richiedono
          # DB / R2 reali.
          docker run --rm \
            -v "${{ github.workspace }}/artifacts:/app/artifacts" \
            -e PYTHONPATH=/app \
            ml-runner:latest \
            python -m pytest ml/tests \
              --ignore=ml/tests/test_integration_contract.py \
              --ignore=ml/tests/test_e2e_decision_contract.py \
              --ignore=ml/tests/test_foreign_pipeline_golden.py \
              --ignore=ml/tests/test_frontend_auction_contract.py \
              -q --no-header -m "not slow" \
              --junitxml=artifacts/junit-unit.xml \
              2>&1 | tee artifacts/unit.log
          echo "exit_code=${PIPESTATUS[0]}" > artifacts/unit.exit
          tail -50 artifacts/unit.log

      - name: Collect unit test summary
        if: always()
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          import pathlib
          import xml.etree.ElementTree as ET
          log = pathlib.Path("artifacts/unit.log").read_text() if pathlib.Path("artifacts/unit.log").exists() else ""
          junit = pathlib.Path("artifacts/junit-unit.xml")
          passed = failed = errors = skipped = 0
          if junit.exists():
              root = ET.parse(junit).getroot()
              for tc in root.iter("testcase"):
                  for child in tc:
                      tag = child.tag.lower()
                      if tag == "failure":
                          failed += 1
                      elif tag == "error":
                          errors += 1
                      elif tag == "skipped":
                          skipped += 1
              passed = int(root.attrib.get("tests", 0)) - failed - errors - skipped
          summary = {
              "phase": "unit",
              "passed": max(passed, 0),
              "failed": failed,
              "errors": errors,
              "skipped": skipped,
              "log_tail": log.splitlines()[-50:],
          }
          pathlib.Path("${{ env.ARTIFACT_TEST_SUMMARY }}").write_text(
              json.dumps({"unit": summary}, indent=2)
          )
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-test-unit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/junit-unit.xml
            artifacts/unit.log
            artifacts/unit.exit
            ${{ env.ARTIFACT_TEST_SUMMARY }}
          if-no-files-found: warn
          retention-days: 30

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Unit tests failed. La pipeline non può procedere verso train/validate/promote."
          cat artifacts/unit.log 2>/dev/null | tail -80 || true

  integration-tests:
    name: "Phase 3 — Integration tests"
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq jq
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ml-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/

      - name: Build ML image
        run: docker build -f ml/Dockerfile -t ml-runner:latest .

      - name: Run integration tests
        run: |
          mkdir -p artifacts
          docker run --rm \
            -v "${{ github.workspace }}/artifacts:/app/artifacts" \
            -e PYTHONPATH=/app \
            -e ML_DATABASE_URL="${ML_DATABASE_URL}" \
            -e ML_R2_ENDPOINT_URL="${ML_R2_ENDPOINT_URL}" \
            -e ML_R2_ACCESS_KEY_ID="${ML_R2_ACCESS_KEY_ID}" \
            -e ML_R2_SECRET_ACCESS_KEY="${ML_R2_SECRET_ACCESS_KEY}" \
            -e ML_R2_BUCKET_NAME="${ML_R2_BUCKET_NAME}" \
            ml-runner:latest \
            python -m pytest ml/tests/test_integration_contract.py \
              -q --no-header \
              --junitxml=artifacts/junit-integration.xml \
              2>&1 | tee artifacts/integration.log
          echo "exit_code=${PIPESTATUS[0]}" > artifacts/integration.exit
          tail -50 artifacts/integration.log
        env:
          ML_DATABASE_URL: ${{ secrets.ML_DATABASE_URL }}
          ML_R2_ENDPOINT_URL: ${{ secrets.ML_R2_ENDPOINT_URL }}
          ML_R2_ACCESS_KEY_ID: ${{ secrets.ML_R2_ACCESS_KEY_ID }}
          ML_R2_SECRET_ACCESS_KEY: ${{ secrets.ML_R2_SECRET_ACCESS_KEY }}

      - name: Collect integration test summary
        if: always()
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          import pathlib
          import xml.etree.ElementTree as ET
          log = pathlib.Path("artifacts/integration.log").read_text() if pathlib.Path("artifacts/integration.log").exists() else ""
          junit = pathlib.Path("artifacts/junit-integration.xml")
          passed = failed = errors = skipped = 0
          if junit.exists():
              root = ET.parse(junit).getroot()
              for tc in root.iter("testcase"):
                  for child in tc:
                      tag = child.tag.lower()
                      if tag == "failure":
                          failed += 1
                      elif tag == "error":
                          errors += 1
                      elif tag == "skipped":
                          skipped += 1
              passed = int(root.attrib.get("tests", 0)) - failed - errors - skipped
          summary = {
              "phase": "integration",
              "passed": max(passed, 0),
              "failed": failed,
              "errors": errors,
              "skipped": skipped,
              "log_tail": log.splitlines()[-50:],
          }
          ts_path = pathlib.Path("${{ env.ARTIFACT_TEST_SUMMARY }}")
          current = json.loads(ts_path.read_text()) if ts_path.exists() else {}
          current["integration"] = summary
          ts_path.write_text(json.dumps(current, indent=2))
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-test-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/junit-integration.xml
            artifacts/integration.log
            artifacts/integration.exit
            ${{ env.ARTIFACT_TEST_SUMMARY }}
          if-no-files-found: warn
          retention-days: 30

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Integration tests failed."
          cat artifacts/integration.log 2>/dev/null | tail -80 || true

  e2e-tests:
    name: "Phase 4 — E2E tests"
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq jq
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ml-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/

      - name: Build ML image
        run: docker build -f ml/Dockerfile -t ml-runner:latest .

      - name: Run E2E tests (decision contract + frontend auction)
        run: |
          mkdir -p artifacts
          docker run --rm \
            -v "${{ github.workspace }}/artifacts:/app/artifacts" \
            -e PYTHONPATH=/app \
            -e ML_DATABASE_URL="${ML_DATABASE_URL}" \
            -e ML_R2_ENDPOINT_URL="${ML_R2_ENDPOINT_URL}" \
            -e ML_R2_ACCESS_KEY_ID="${ML_R2_ACCESS_KEY_ID}" \
            -e ML_R2_SECRET_ACCESS_KEY="${ML_R2_SECRET_ACCESS_KEY}" \
            -e ML_R2_BUCKET_NAME="${ML_R2_BUCKET_NAME}" \
            ml-runner:latest \
            python -m pytest \
              ml/tests/test_e2e_decision_contract.py \
              ml/tests/test_frontend_auction_contract.py \
              ml/tests/test_foreign_pipeline_golden.py \
              -q --no-header \
              --junitxml=artifacts/junit-e2e.xml \
              2>&1 | tee artifacts/e2e.log
          echo "exit_code=${PIPESTATUS[0]}" > artifacts/e2e.exit
          tail -50 artifacts/e2e.log
        env:
          ML_DATABASE_URL: ${{ secrets.ML_DATABASE_URL }}
          ML_R2_ENDPOINT_URL: ${{ secrets.ML_R2_ENDPOINT_URL }}
          ML_R2_ACCESS_KEY_ID: ${{ secrets.ML_R2_ACCESS_KEY_ID }}
          ML_R2_SECRET_ACCESS_KEY: ${{ secrets.ML_R2_SECRET_ACCESS_KEY }}

      - name: Collect E2E test summary
        if: always()
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          import pathlib
          import xml.etree.ElementTree as ET
          log = pathlib.Path("artifacts/e2e.log").read_text() if pathlib.Path("artifacts/e2e.log").exists() else ""
          junit = pathlib.Path("artifacts/junit-e2e.xml")
          passed = failed = errors = skipped = 0
          if junit.exists():
              root = ET.parse(junit).getroot()
              for tc in root.iter("testcase"):
                  for child in tc:
                      tag = child.tag.lower()
                      if tag == "failure":
                          failed += 1
                      elif tag == "error":
                          errors += 1
                      elif tag == "skipped":
                          skipped += 1
              passed = int(root.attrib.get("tests", 0)) - failed - errors - skipped
          summary = {
              "phase": "e2e",
              "passed": max(passed, 0),
              "failed": failed,
              "errors": errors,
              "skipped": skipped,
              "log_tail": log.splitlines()[-50:],
          }
          ts_path = pathlib.Path("${{ env.ARTIFACT_TEST_SUMMARY }}")
          current = json.loads(ts_path.read_text()) if ts_path.exists() else {}
          current["e2e"] = summary
          ts_path.write_text(json.dumps(current, indent=2))
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-test-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/junit-e2e.xml
            artifacts/e2e.log
            artifacts/e2e.exit
            ${{ env.ARTIFACT_TEST_SUMMARY }}
          if-no-files-found: warn
          retention-days: 30

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::E2E tests failed."
          cat artifacts/e2e.log 2>/dev/null | tail -80 || true

  # ── FASE 5: Training ────────────────────────────────────────────────
  # train richiede TUTTI i test passati.  Produce effective_config,
  # shadow_comparison e canary_report (WS14 §16.1).

  train:
    name: "Phase 5 — Train (produces effective_config, shadow_comparison, canary_report)"
    needs: [build, unit-tests, integration-tests, e2e-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ML_DATABASE_URL: ${{ secrets.ML_DATABASE_URL }}
      ML_R2_ENDPOINT_URL: ${{ secrets.ML_R2_ENDPOINT_URL }}
      ML_R2_ACCESS_KEY_ID: ${{ secrets.ML_R2_ACCESS_KEY_ID }}
      ML_R2_SECRET_ACCESS_KEY: ${{ secrets.ML_R2_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq jq
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ml-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/

      - name: Download unit test summary
        uses: actions/download-artifact@v4
        with:
          name: ml-test-unit-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/_test_summaries/unit/
      - name: Download integration test summary
        uses: actions/download-artifact@v4
        with:
          name: ml-test-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/_test_summaries/integration/
      - name: Download e2e test summary
        uses: actions/download-artifact@v4
        with:
          name: ml-test-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/_test_summaries/e2e/

      - name: Merge test_summary.json
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          import pathlib
          merged = {}
          for phase in ("unit", "integration", "e2e"):
              candidates = list(pathlib.Path("artifacts/_test_summaries").rglob("test_summary.json"))
              for c in candidates:
                  data = json.loads(c.read_text())
                  if phase in data:
                      merged[phase] = data[phase]
          pathlib.Path("${{ env.ARTIFACT_TEST_SUMMARY }}").write_text(
              json.dumps(merged, indent=2)
          )
          print(json.dumps(merged, indent=2))
          PY

      - name: Build ML image
        run: docker build -f ml/Dockerfile -t ml-runner:latest .

      - name: Run training pipeline
        run: |
          set -euo pipefail
          ARGS=()

          if [ -n "${{ github.event.inputs.league }}" ]; then
            ARGS+=(--league "${{ github.event.inputs.league }}")
          fi
          ARGS+=(--clusters "${{ github.event.inputs.clusters || '6' }}")
          ARGS+=(--tune-iter "${{ github.event.inputs.tune_iter || '30' }}")
          ARGS+=(--test-seasons "${{ github.event.inputs.test_seasons || '1' }}")
          ARGS+=(--min-minutes "${{ github.event.inputs.min_minutes || '800' }}")
          ARGS+=(--seed "${{ github.event.inputs.seed || '42' }}")
          ARGS+=(--log-level "${{ github.event.inputs.log_level || 'INFO' }}")

          if [ "${{ github.event.inputs.tune }}" = "true" ]; then
            ARGS+=(--tune)
          fi
          if [ "${{ github.event.inputs.predict_next }}" = "true" ]; then
            ARGS+=(--predict-next)
          fi
          if [ "${{ github.event.inputs.evaluate_mantra }}" = "true" ]; then
            ARGS+=(--evaluate-mantra)
          fi

          if [ -n "${{ github.event.inputs.fantavoto_csv }}" ]; then
            ARGS+=(--fantavoto-csv "${{ github.event.inputs.fantavoto_csv }}")
          elif [ -f artifacts/fantavoto_real.csv ]; then
            ARGS+=(--fantavoto-csv /app/artifacts/fantavoto_real.csv)
          fi

          if [ -n "${{ github.event.inputs.output_dir }}" ]; then
            ARGS+=(--output-dir "${{ github.event.inputs.output_dir }}")
          fi

          ARGS+=(--json-logs)
          # WS14 — chiedi esplicitamente al trainer di produrre effective_config,
          # canary_report e promotion_report; shadow_comparison viene generato in SHADOW.
          ARGS+=(--emit-effective-config "$ARTIFACT_EFFECTIVE_CONFIG")
          ARGS+=(--emit-canary-report "$ARTIFACT_CANARY_REPORT")
          ARGS+=(--emit-promotion-report "$ARTIFACT_PROMOTION_REPORT")

          echo "Pipeline args: ${ARGS[*]}"

          ROLLOUT_ENV_ARGS=()
          while IFS= read -r flag_name; do
            [ -z "${flag_name}" ] && continue
            upper=$(echo "${flag_name}" | tr '[:lower:]' '[:upper:]')
            ROLLOUT_ENV_ARGS+=(-e "ML_${upper}=true")
            echo "  → ACTIVE flag: ${flag_name} (ML_${upper}=true)"
          done <<< "${{ needs.build.outputs.active_flags }}"

          while IFS= read -r flag_name; do
            [ -z "${flag_name}" ] && continue
            upper=$(echo "${flag_name}" | tr '[:lower:]' '[:upper:]')
            ROLLOUT_ENV_ARGS+=(-e "ML_${upper}_CHALLENGER=true")
            echo "  → SHADOW flag: ${flag_name} (ML_${upper}_CHALLENGER=true)"
          done <<< "${{ needs.build.outputs.shadow_flags }}"

          while IFS= read -r mode_kv; do
            [ -z "${mode_kv}" ] && continue
            key="${mode_kv%%=*}"
            val="${mode_kv#*=}"
            upper=$(echo "${key}" | tr '[:lower:]' '[:upper:]')
            ROLLOUT_ENV_ARGS+=(-e "ML_${upper}=${val}")
            echo "  → mode: ${key}=${val} (ML_${upper}=${val})"
          done <<< "${{ needs.build.outputs.mode_flags }}"

          docker run --rm \
            -e ML_DATABASE_URL \
            -e ML_R2_ENDPOINT_URL \
            -e ML_R2_ACCESS_KEY_ID \
            -e ML_R2_SECRET_ACCESS_KEY \
            -e ML_R2_BUCKET_NAME \
            -e ML_ARTIFACTS_DIR=/app/artifacts \
            "${ROLLOUT_ENV_ARGS[@]}" \
            -v "${{ github.workspace }}/artifacts:/app/artifacts" \
            ml-runner:latest \
            "${ARGS[@]}"

      - name: Verify mandatory artifacts (WS14 §16.1)
        if: always()
        run: |
          missing=0
          for art in \
            "$ARTIFACT_EFFECTIVE_CONFIG" \
            "$ARTIFACT_PROMOTION_REPORT" \
            "$ARTIFACT_CANARY_REPORT" \
            ; do
            if [ ! -s "${art}" ]; then
              echo "::error::Required artifact missing or empty: ${art}"
              missing=1
            else
              echo "OK: ${art} ($(wc -c < "${art}") bytes)"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: List produced artifacts
        if: always()
        run: |
          echo "=== artifacts/ ==="
          find artifacts -type f 2>/dev/null | head -120 || true

      - name: Upload training artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-train-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Training fallito — controlla i log sopra. Nessun nuovo run_id è stato promosso."

  # ── FASE 6-7: Generate experiment/canary report & validate ────────
  # Il promotion_report è già stato risolto dal job build. Qui lo
  # validiamo formalmente.  Anche il canary_report è già prodotto da
  # train; questo job ne verifica la presenza e lo pubblica.

  validate-reports:
    name: "Phase 6 — Validate reports (promotion + canary + config)"
    needs: [build, train]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq jq
          fi

      - name: Download build + training artifacts
        uses: actions/download-artifact@v4
        with:
          name: ml-train-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/

      - name: Verify all WS14 §16.1 artifacts are present
        run: |
          missing=0
          for art in \
            "$ARTIFACT_EFFECTIVE_CONFIG" \
            "$ARTIFACT_PROMOTION_REPORT" \
            "$ARTIFACT_CANARY_REPORT" \
            ; do
            if [ ! -s "${art}" ]; then
              echo "::error::Required artifact missing or empty: ${art}"
              missing=1
            else
              echo "OK: ${art} ($(wc -c < "${art}") bytes)"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Build ML image (for check_promotion_gate)
        run: docker build -f ml/Dockerfile -t ml-runner:latest .

      - name: Run check_promotion_gate (must PASS)
        run: |
          mkdir -p artifacts
          docker run --rm \
            -v "${{ github.workspace }}/artifacts:/app/artifacts" \
            -e PYTHONPATH=/app \
            ml-runner:latest \
            python -m ml.scripts.check_promotion_gate \
              "$ARTIFACT_PROMOTION_REPORT" \
              --config-snapshot "$ARTIFACT_EFFECTIVE_CONFIG" \
              --json-summary \
              | tee artifacts/promotion_gate.json
          echo "exit_code=${PIPESTATUS[0]}" > artifacts/promotion_gate.exit

      - name: Validate canary_report structure
        run: |
          python - <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path("${{ env.ARTIFACT_CANARY_REPORT }}")
          data = json.loads(path.read_text())

          # Verifica campi minimi: un canary report valido deve avere
          # almeno un'indicazione sulle anomalies rimanenti.
          required = ("anomalies",)
          missing = [k for k in required if k not in data]
          if missing:
              print(f"::error::canary_report missing keys: {missing}")
              sys.exit(1)

          anomalies = data.get("anomalies", {})
          remaining = (
              anomalies.get("remaining")
              or anomalies.get("remaining_count")
              or data.get("canary_anomalies_remaining")
          )
          if remaining is None:
              print("::error::canary_report: cannot determine 'remaining' anomalies")
              sys.exit(1)

          if int(remaining) > 0:
              print(f"::error::canary anomalies remaining = {remaining} > 0 — pipeline must stop")
              sys.exit(1)

          print(f"canary_report OK: {remaining} remaining anomalies")
          PY

      - name: Validate effective_config has config_hash
        run: |
          python - <<'PY'
          import json
          import pathlib
          import sys
          data = json.loads(pathlib.Path("${{ env.ARTIFACT_EFFECTIVE_CONFIG }}").read_text())
          h = data.get("config_hash")
          if not h:
              print("::error::effective_config.json missing config_hash (WS16)")
              sys.exit(1)
          print(f"effective_config OK: config_hash={h[:16]}...")
          PY

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-validate-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/promotion_gate.json
            artifacts/promotion_gate.exit
            ${{ env.ARTIFACT_EFFECTIVE_CONFIG }}
            ${{ env.ARTIFACT_PROMOTION_REPORT }}
            ${{ env.ARTIFACT_CANARY_REPORT }}
            ${{ env.ARTIFACT_TEST_SUMMARY }}
          if-no-files-found: warn
          retention-days: 90

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Report validation failed. ACTIVE non può essere raggiunto senza un promotion_report valido."

  # ── FASE 8: Validate config drift ────────────────────────────────
  # Confronta lo stato di rollout dichiarato con la effective_config
  # del training.  FAIL-closed: P0 → exit 1, blocca la pipeline.

  validate-config-drift:
    name: "Phase 7 — Validate config drift (P0 = blocca pipeline)"
    needs: validate-reports
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq jq
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: ml-validate-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/

      - name: Build ML image
        run: docker build -f ml/Dockerfile -t ml-runner:latest .

      - name: Detect config drift (P0 = exit 1)
        run: |
          mkdir -p artifacts
          docker run --rm \
            --entrypoint python \
            -v "${{ github.workspace }}/artifacts:/app/artifacts" \
            -e PYTHONPATH=/app \
            -e ARTIFACT_EFFECTIVE_CONFIG \
            -e PROMOTE_FLAG \
            -e LOG_LEVEL \
            ml-runner:latest \
            -m ml.scripts.detect_config_drift

      - name: Upload config drift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-config-drift-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/config_drift.json
          if-no-files-found: warn
          retention-days: 90

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Config drift P0 rilevato. ACTIVE non può essere raggiunto con drift di configurazione."

  # ── FASE 9: SHADOW transition ────────────────────────────────────
  # Se l'utente ha specificato un flag da promuovere, lo portiamo a
  # SHADOW (compute + observe only).

  promote-to-shadow:
    name: "Phase 8 — SHADOW transition"
    needs: validate-config-drift
    if: ${{ github.event.inputs.promote_flag != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ML_DATABASE_URL: ${{ secrets.ML_DATABASE_URL }}
      ML_R2_ENDPOINT_URL: ${{ secrets.ML_R2_ENDPOINT_URL }}
      ML_R2_ACCESS_KEY_ID: ${{ secrets.ML_R2_ACCESS_KEY_ID }}
      ML_R2_SECRET_ACCESS_KEY: ${{ secrets.ML_R2_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: ml-validate-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/

      - name: Build ML image
        run: docker build -f ml/Dockerfile -t ml-runner:latest .

      - name: Promote to SHADOW (no break-glass possible)
        run: |
          docker run --rm \
            --entrypoint python \
            -e ML_R2_ENDPOINT_URL \
            -e ML_R2_ACCESS_KEY_ID \
            -e ML_R2_SECRET_ACCESS_KEY \
            -e ML_R2_BUCKET_NAME \
            -v "${{ github.workspace }}/artifacts:/app/artifacts" \
            ml-runner:latest \
            -m ml.run_rollout \
              --artifacts-dir /app/artifacts \
              --r2-bucket "${ML_R2_BUCKET_NAME}" \
              --sync-r2 \
              --json-logs \
              shadow \
              "${{ github.event.inputs.promote_flag }}" \
              --rollout-pct "${{ github.event.inputs.promote_rollout_pct }}" \
              --actor "github-actions/ml-training" \
              --note "Auto SHADOW via ml-training pipeline run=${{ github.run_id }}"

      - name: Upload SHADOW state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-shadow-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/rollout/
          if-no-files-found: warn
          retention-days: 90

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::SHADOW transition fallita. Lo stato su R2 potrebbe essere inconsistente; verificare con ml-rollout action=status."

  # ── FASE 10: Observe (periodo di osservazione) ───────────────────
  # In CI reale questo step potrebbe essere un wait condizionato da
  # metriche osservabili.  Per la versione iniziale, è un sleep
  # parametrico (default 5 min) che lascia tempo al sistema per
  # produrre artefatti osservabili.

  observe:
    name: "Phase 9 — Observe SHADOW (wait + verify artifacts)"
    needs: promote-to-shadow
    if: ${{ github.event.inputs.promote_flag != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # ML_DATABASE_URL: opzionale in MLConfig (reso tale per non bloccare i
      # subcommand rollout che non accedono al DB), ma esportato qui come
      # safety net: se un futuro subcommand inizia a leggere il DB, fallirà
      # esplicitamente via MLConfig.get_database_url() invece di crashare
      # su connessione None.  Coerente con ``promote-to-shadow`` e
      # ``promote-to-active``.
      ML_DATABASE_URL: ${{ secrets.ML_DATABASE_URL }}
      ML_R2_ENDPOINT_URL: ${{ secrets.ML_R2_ENDPOINT_URL }}
      ML_R2_ACCESS_KEY_ID: ${{ secrets.ML_R2_ACCESS_KEY_ID }}
      ML_R2_SECRET_ACCESS_KEY: ${{ secrets.ML_R2_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq jq
          fi

      - name: Download SHADOW state
        uses: actions/download-artifact@v4
        with:
          name: ml-shadow-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/

      - name: Verify SHADOW stage is active for the flag
        run: |
          if [ ! -f artifacts/rollout/state.json ]; then
            echo "::error::Missing rollout state — cannot verify SHADOW."
            exit 1
          fi
          STAGE=$(jq -r --arg flag "${{ github.event.inputs.promote_flag }}" \
            '.flags[$flag].stage // "missing"' artifacts/rollout/state.json)
          if [ "${STAGE}" != "shadow" ]; then
            echo "::error::Flag ${{ github.event.inputs.promote_flag }} stage=${STAGE} (expected shadow)"
            exit 1
          fi
          echo "OK: ${{ github.event.inputs.promote_flag }} stage=${STAGE}"

      - name: Observe (sleep + capture metrics)
        run: |
          MINUTES="${{ github.event.inputs.observe_minutes }}"
          # Converti in secondi (con minimo 1s, massimo 25 minuti per restare
          # sotto il timeout di Actions per i job non-interattivi).
          SECONDS=$(( MINUTES * 60 ))
          if [ "${SECONDS}" -lt 60 ]; then SECONDS=60; fi
          if [ "${SECONDS}" -gt 1500 ]; then SECONDS=1500; fi
          echo "Observation window: ${SECONDS}s"
          # Snapshot periodico dello stato (utile per audit).
          for i in 1 2 3 4 5; do
            sleep $(( SECONDS / 5 ))
            echo "--- observe tick ${i}/5 ---"
            if [ -f artifacts/rollout/state.json ]; then
              jq '.flags' artifacts/rollout/state.json
            fi
          done

      - name: Generate shadow_comparison.json (WS14 §16.1)
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          import pathlib
          state = json.loads(pathlib.Path("artifacts/rollout/state.json").read_text())
          flag = "${{ github.event.inputs.promote_flag }}"
          fs = state.get("flags", {}).get(flag, {})
          shadow = {
              "flag": flag,
              "stage": fs.get("stage"),
              "rollout_pct": fs.get("rollout_pct"),
              "compute": fs.get("stage") in ("shadow", "active"),
              "use_in_production": fs.get("stage") == "active",
              "updated_at": fs.get("updated_at"),
              "updated_by": fs.get("updated_by"),
              "note": fs.get("note"),
          }
          pathlib.Path("${{ env.ARTIFACT_SHADOW_COMPARISON }}").write_text(
              json.dumps(shadow, indent=2)
          )
          print(json.dumps(shadow, indent=2))
          PY

      - name: Upload shadow_comparison + observe state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-observe-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/rollout/
            ${{ env.ARTIFACT_SHADOW_COMPARISON }}
          if-no-files-found: warn
          retention-days: 90

  # ── FASE 11: ACTIVE (promotion gate enforced, no break-glass) ──
  # Questo job chiama ml.run_rollout activate con --promotion-report.
  # Se il gate fallisce, il job termina con exit 3 e lo stato rimane
  # SHADOW.  Break-glass NON è disponibile qui.

  promote-to-active:
    name: "Phase 10 — ACTIVE (hard promotion gate, no break-glass)"
    needs: [observe, validate-reports]
    if: ${{ github.event.inputs.promote_flag != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # ML_DATABASE_URL: opzionale in MLConfig (reso tale per non bloccare i
      # subcommand rollout che non accedono al DB), ma esportato qui come
      # safety net: se un futuro subcommand inizia a leggere il DB, fallirà
      # esplicitamente via MLConfig.get_database_url() invece di crashare
      # su connessione None.  Coerente con ``promote-to-shadow``.
      ML_DATABASE_URL: ${{ secrets.ML_DATABASE_URL }}
      ML_R2_ENDPOINT_URL: ${{ secrets.ML_R2_ENDPOINT_URL }}
      ML_R2_ACCESS_KEY_ID: ${{ secrets.ML_R2_ACCESS_KEY_ID }}
      ML_R2_SECRET_ACCESS_KEY: ${{ secrets.ML_R2_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq jq
          fi

      - name: Download all upstream artifacts
        uses: actions/download-artifact@v4
        with:
          name: ml-validate-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/

      - name: Download observe artifacts
        uses: actions/download-artifact@v4
        with:
          name: ml-observe-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/

      - name: Build ML image
        run: docker build -f ml/Dockerfile -t ml-runner:latest .

      - name: Promote to ACTIVE (gate enforced)
        run: |
          # Idempotenza: se la pipeline viene rieseguita, non deve
          # rompere lo stato SHADOW se ACTIVE fallisce.  Il comando
          # sotto esegue comunque il gate; in caso di DENY lo stato
          # resta invariato (vedi ml.run_rollout.cmd_transition).
          set +e
          docker run --rm \
            --entrypoint python \
            -e ML_R2_ENDPOINT_URL \
            -e ML_R2_ACCESS_KEY_ID \
            -e ML_R2_SECRET_ACCESS_KEY \
            -e ML_R2_BUCKET_NAME \
            -v "${{ github.workspace }}/artifacts:/app/artifacts" \
            ml-runner:latest \
            -m ml.run_rollout \
              --artifacts-dir /app/artifacts \
              --r2-bucket "${ML_R2_BUCKET_NAME}" \
              --sync-r2 \
              --json-logs \
              activate \
              "${{ github.event.inputs.promote_flag }}" \
              --rollout-pct "${{ github.event.inputs.promote_rollout_pct }}" \
              --promotion-report "$ARTIFACT_PROMOTION_REPORT" \
              --config-snapshot "$ARTIFACT_EFFECTIVE_CONFIG" \
              --actor "github-actions/ml-training" \
              --note "Auto ACTIVE via ml-training pipeline run=${{ github.run_id }}" \
              | tee artifacts/activate.json
          RC=$?
          set -e
          echo "activate exit_code=${RC}" > artifacts/activate.exit
          if [ "${RC}" -ne 0 ]; then
            echo "::error::ACTIVE promotion denied/failed (exit ${RC}). Lo stato resta invariato su R2."
            cat artifacts/activate.json 2>/dev/null || true
          fi
          exit ${RC}

      - name: Upload ACTIVE result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-activate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/rollout/
            artifacts/activate.json
            artifacts/activate.exit
          if-no-files-found: warn
          retention-days: 90

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::ACTIVE promotion fallita. Lo stato del flag resta a SHADOW (o allo stage precedente). Verificare con ml-rollout action=status."

  # ── FASE 12: Final certification ────────────────────────────────
  # Pubblica TUTTI gli artefatti obbligatori (WS14 §16.1) e uno
  # summary finale.  Questo job è "always-run" e serve a dare un
  # unico artifact con tutti i 5 file richiesti dal piano.

  publish-final-artifacts:
    name: "Phase 11 — Publish final artifacts (WS14 §16.1)"
    needs: [unit-tests, integration-tests, e2e-tests, train, validate-reports]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq jq
          fi

      - name: Download training artifacts
        uses: actions/download-artifact@v4
        with:
          name: ml-train-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
      - name: Download validation artifacts
        uses: actions/download-artifact@v4
        with:
          name: ml-validate-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
      - name: Download observe artifacts
        # L'artifact ml-observe esiste solo quando l'utente ha
        # specificato un promote_flag (Phase 9 ha `if: promote_flag != ''`).
        # In caso contrario il download non produce file: lo step non deve
        # bloccare la pipeline di pubblicazione, ma solo segnalare un warning.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ml-observe-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/

      - name: Build summary index of WS14 §16.1 artifacts
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          import pathlib
          index = {
              "required_artifacts": {
                  "effective_config.json": "${{ env.ARTIFACT_EFFECTIVE_CONFIG }}",
                  "promotion_report.json": "${{ env.ARTIFACT_PROMOTION_REPORT }}",
                  "shadow_comparison.json": "${{ env.ARTIFACT_SHADOW_COMPARISON }}",
                  "canary_report.json": "${{ env.ARTIFACT_CANARY_REPORT }}",
                  "test_summary.json": "${{ env.ARTIFACT_TEST_SUMMARY }}",
              },
              "present": {},
          }
          for label, p in index["required_artifacts"].items():
              f = pathlib.Path(p)
              if f.exists() and f.stat().st_size > 0:
                  index["present"][label] = {
                      "path": p,
                      "bytes": f.stat().st_size,
                  }
              else:
                  index["present"][label] = {
                      "path": p,
                      "bytes": 0,
                      "missing": True,
                  }
          index["all_present"] = all(
              not v.get("missing") for v in index["present"].values()
          )
          pathlib.Path("artifacts/ws14_artifacts_index.json").write_text(
              json.dumps(index, indent=2)
          )
          print(json.dumps(index, indent=2))
          if not index["all_present"]:
              print("::warning::Alcuni artefatti obbligatori (WS14 §16.1) sono mancanti.")
          PY

      - name: Upload final artifacts bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-ws14-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.ARTIFACT_EFFECTIVE_CONFIG }}
            ${{ env.ARTIFACT_PROMOTION_REPORT }}
            ${{ env.ARTIFACT_SHADOW_COMPARISON }}
            ${{ env.ARTIFACT_CANARY_REPORT }}
            ${{ env.ARTIFACT_TEST_SUMMARY }}
            artifacts/ws14_artifacts_index.json
          if-no-files-found: warn
          retention-days: 90

      - name: Final notification
        if: always()
        run: |
          if [ -f artifacts/ws14_artifacts_index.json ]; then
            cat artifacts/ws14_artifacts_index.json
          fi
