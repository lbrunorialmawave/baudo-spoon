name: ML Training

on:
  # Esecuzione manuale da tab "Actions" con parametri custom.
  workflow_dispatch:
    inputs:
      league:
        description: "Lega da filtrare (default Serie A — vedi MLConfig.league_name)"
        required: false
        default: "Serie A"

      tune:
        description: "Esegui RandomizedSearchCV (più lento, più preciso)"
        type: boolean
        default: true

      tune_iter:
        description: "Numero di combinazioni RandomizedSearchCV"
        required: false
        default: "120"

      clusters:
        description: "Numero di cluster K-Medoids (-1 = auto via silhouette)"
        required: false
        default: "-1"

      predict_next:
        description: "Ri-fit su tutti i dati e predici prossima stagione"
        type: boolean
        default: true

      evaluate_mantra:
        description: "Esegui valutazione MANTRA dopo il training"
        type: boolean
        default: false

      test_seasons:
        description: "Stagioni di test (hold-out più recenti)"
        required: false
        default: "1"

      min_minutes:
        description: "Minuti minimi per includere un giocatore (MLConfig.min_minutes)"
        required: false
        default: "800"

      seed:
        description: "Random seed per riproducibilità"
        required: false
        default: "42"

      log_level:
        description: "Livello di logging"
        required: false
        default: "INFO"

      output_dir:
        description: "Directory artefatti (vuoto = default /app/artifacts)"
        required: false
        default: ""

      # Se lasciato vuoto → scarica automaticamente fantavoto_real.csv da R2
      # e lo passa come --fantavoto-csv /app/artifacts/fantavoto_real.csv
      fantavoto_csv:
        description: "Path al CSV fantavoto nel container (vuoto = download automatico da R2)"
        required: false
        default: ""

  # Schedulazione: ogni lunedì alle 06:00 UTC (~08:00 CEST)
  # schedule:
  #   - cron: "0 6 * * 1"

# Evita run sovrapposte se ne parte una manuale mentre gira quella schedulata.
concurrency:
  group: ml-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      ML_DATABASE_URL: ${{ secrets.ML_DATABASE_URL }}
      ML_R2_ENDPOINT_URL: ${{ secrets.ML_R2_ENDPOINT_URL }}
      ML_R2_ACCESS_KEY_ID: ${{ secrets.ML_R2_ACCESS_KEY_ID }}
      ML_R2_SECRET_ACCESS_KEY: ${{ secrets.ML_R2_SECRET_ACCESS_KEY }}
      ML_R2_BUCKET_NAME: ${{ secrets.ML_R2_BUCKET_NAME || 'baudo-spoon-ml-artifacts' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          missing=0
          for var in ML_DATABASE_URL ML_R2_ENDPOINT_URL ML_R2_ACCESS_KEY_ID ML_R2_SECRET_ACCESS_KEY; do
            if [ -z "${!var}" ]; then
              echo "::error::Secret $var is not set"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "All required secrets are present."

      # ── Rollout state (PR8) ─────────────────────────────────────────────────
      # Scarica lo stato dei feature flag da R2 (scritto da ml-rollout.yml) e
      # traduce gli stage ≥ SHADOW in env vars per il container.
      # Se lo stato non esiste (primo run), tutti i flag restano DISABLED
      # e nessuna env var viene impostata → comportamento legacy intatto.
      - name: Install jq (for rollout state parsing)
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq jq
          fi
          jq --version

      - name: Read rollout state from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ML_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ML_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          mkdir -p artifacts/rollout
          echo "Downloading s3://${ML_R2_BUCKET_NAME}/rollout/state.json ..."
          if aws s3 cp \
              "s3://${ML_R2_BUCKET_NAME}/rollout/state.json" \
              artifacts/rollout/state.json \
              --endpoint-url "${ML_R2_ENDPOINT_URL}" 2>/dev/null; then
            echo "Rollout state scaricato:"
            cat artifacts/rollout/state.json
          else
            echo "::notice::Nessun rollout state in R2 → tutti i flag DISABLED (legacy behaviour)."
            echo '{"version":1,"flags":{},"audit":[]}' > artifacts/rollout/state.json
          fi

      - name: Translate rollout state to env vars
        id: rollout_env
        run: |
          # Mappa stage ≥ SHADOW → env var = "true", altrimenti omessa.
          # jq seleziona solo i flag con stage in (shadow, active).
          ENABLED_FLAGS=$(jq -r '
            .flags | to_entries[]
            | select(.value.stage == "shadow" or .value.stage == "active")
            | .key
          ' artifacts/rollout/state.json)
          echo "Flag abilitati (stage ≥ SHADOW):"
          echo "${ENABLED_FLAGS:-<nessuno>}"
          {
            echo "ENABLED_FLAGS<<EOF"
            echo "${ENABLED_FLAGS}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Scarica fantavoto_real.csv da R2 se l'utente non ha passato un path custom.
      # Il file finisce in ./artifacts sul runner e viene montato in /app/artifacts
      # nel container.
      - name: Download fantavoto_real.csv from R2
        if: ${{ github.event.inputs.fantavoto_csv == '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ML_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ML_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          mkdir -p artifacts
          echo "Downloading s3://${ML_R2_BUCKET_NAME}/fantavoto_real.csv ..."
          # ubuntu-latest ha già awscli; fallback via pip se manca
          if ! command -v aws >/dev/null 2>&1; then
            pip install --quiet awscli
          fi
          aws s3 cp \
            "s3://${ML_R2_BUCKET_NAME}/fantavoto_real.csv" \
            artifacts/fantavoto_real.csv \
            --endpoint-url "${ML_R2_ENDPOINT_URL}"

          if [ ! -s artifacts/fantavoto_real.csv ]; then
            echo "::error::Downloaded fantavoto_real.csv is missing or empty"
            exit 1
          fi

          echo "Downloaded OK:"
          ls -lh artifacts/fantavoto_real.csv
          echo "--- header ---"
          head -3 artifacts/fantavoto_real.csv

      # Build dal Dockerfile esistente: stesse dipendenze di locale / Render.
      # Contesto = root del repo perché ml/Dockerfile fa `COPY ml/requirements.txt .`
      - name: Build ML image
        run: docker build -f ml/Dockerfile -t ml-runner:latest .

      - name: Run training pipeline
        run: |
          set -euo pipefail

          # Costruisci gli argomenti in un array (gestisce correttamente gli spazi)
          ARGS=()

          if [ -n "${{ github.event.inputs.league }}" ]; then
            ARGS+=(--league "${{ github.event.inputs.league }}")
          fi

          ARGS+=(--clusters "${{ github.event.inputs.clusters || '6' }}")
          ARGS+=(--tune-iter "${{ github.event.inputs.tune_iter || '30' }}")
          ARGS+=(--test-seasons "${{ github.event.inputs.test_seasons || '1' }}")
          ARGS+=(--min-minutes "${{ github.event.inputs.min_minutes || '800' }}")
          ARGS+=(--seed "${{ github.event.inputs.seed || '42' }}")
          ARGS+=(--log-level "${{ github.event.inputs.log_level || 'INFO' }}")

          if [ "${{ github.event.inputs.tune }}" = "true" ]; then
            ARGS+=(--tune)
          fi

          if [ "${{ github.event.inputs.predict_next }}" = "true" ]; then
            ARGS+=(--predict-next)
          fi

          if [ "${{ github.event.inputs.evaluate_mantra }}" = "true" ]; then
            ARGS+=(--evaluate-mantra)
          fi

          # Fantavoto: path custom oppure quello scaricato da R2
          if [ -n "${{ github.event.inputs.fantavoto_csv }}" ]; then
            ARGS+=(--fantavoto-csv "${{ github.event.inputs.fantavoto_csv }}")
          elif [ -f artifacts/fantavoto_real.csv ]; then
            ARGS+=(--fantavoto-csv /app/artifacts/fantavoto_real.csv)
          fi

          if [ -n "${{ github.event.inputs.output_dir }}" ]; then
            ARGS+=(--output-dir "${{ github.event.inputs.output_dir }}")
          fi

          ARGS+=(--json-logs)

          echo "Pipeline args: ${ARGS[*]}"

          # Costruisci la lista di env vars per il rollout state (PR8).
          # Mappa flag_name → ML_ENABLE_<UPPER> per attivare il flag
          # corrispondente in MLConfig.  Solo i flag con stage ≥ SHADOW
          # (letti da ${{ steps.rollout_env.outputs.ENABLED_FLAGS }})
          # vengono effettivamente passati al container.
          ROLLOUT_ENV_ARGS=()
          while IFS= read -r flag_name; do
            [ -z "${flag_name}" ] && continue
            upper=$(echo "${flag_name}" | tr '[:lower:]' '[:upper:]')
            ROLLOUT_ENV_ARGS+=(-e "ML_${upper}=true")
            echo "  → attivo flag: ${flag_name} (ML_${upper}=true)"
          done <<< "${{ steps.rollout_env.outputs.ENABLED_FLAGS }}"

          docker run --rm \
            -e ML_DATABASE_URL \
            -e ML_R2_ENDPOINT_URL \
            -e ML_R2_ACCESS_KEY_ID \
            -e ML_R2_SECRET_ACCESS_KEY \
            -e ML_R2_BUCKET_NAME \
            -e ML_ARTIFACTS_DIR=/app/artifacts \
            "${ROLLOUT_ENV_ARGS[@]}" \
            -v "${{ github.workspace }}/artifacts:/app/artifacts" \
            ml-runner:latest \
            "${ARGS[@]}"

      - name: List produced artifacts
        if: always()
        run: |
          echo "=== artifacts/ ==="
          find artifacts -type f 2>/dev/null | head -80 || true

      - name: Upload training artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ml-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30

      # Fallisce esplicitamente il job così Actions e le notifiche email
      # segnalano il training fallito.
      - name: Notify on failure
        if: failure()
        run: echo "::error::Training ML fallito — controlla i log sopra. Nessun nuovo run_id è stato promosso."