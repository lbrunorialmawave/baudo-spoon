name: ML Training

on:
  # Esecuzione manuale da tab "Actions" con parametri custom.
  workflow_dispatch:
    inputs:
      league:
        description: "Lega da filtrare (vuoto = tutte)"
        required: false
        default: ""
      tune:
        description: "Esegui RandomizedSearchCV (più lento, più preciso)"
        type: boolean
        default: false
      tune_iter:
        description: "Numero di combinazioni RandomizedSearchCV"
        required: false
        default: "30"
      clusters:
        description: "Numero di cluster K-Means (-1 = auto via silhouette)"
        required: false
        default: "6"
      predict_next:
        description: "Ri-fit su tutti i dati e predici prossima stagione"
        type: boolean
        default: false
      test_seasons:
        description: "Stagioni di test (hold-out più recenti)"
        required: false
        default: "1"
      min_minutes:
        description: "Minuti minimi per includere un giocatore"
        required: false
        default: "800"
      seed:
        description: "Random seed per riproducibilità"
        required: false
        default: "42"
      fantavoto_csv:
        description: "Path al CSV fantavoto nel container (es. /app/artifacts/fantavoto.csv)"
        required: false
        default: ""

  # Schedulazione: ogni lunedì alle 06:00 UTC (~08:00 CEST), il giorno dopo
  # il turno infrasettimanale/domenicale. Il cron di GitHub Actions è
  # sempre in UTC — aggiusta l'ora se cambia il fuso del campionato.
  # schedule:
  #   - cron: "0 6 * * 1"

# Evita run sovrapposte se ne parte una manuale mentre gira quella schedulata.
concurrency:
  group: ml-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build dal Dockerfile esistente: garantisce le stesse dipendenze/versioni
      # usate in locale (docker compose --profile ml) e su Render Cron Job.
      # Contesto = root del repo perché ml/Dockerfile fa `COPY ml/requirements.txt .`
      - name: Build ML image
        run: docker build -f ml/Dockerfile -t ml-runner:latest .

      - name: Run training pipeline
        env:
          ML_DATABASE_URL: ${{ secrets.ML_DATABASE_URL }}
          ML_R2_ENDPOINT_URL: ${{ secrets.ML_R2_ENDPOINT_URL }}
          ML_R2_ACCESS_KEY_ID: ${{ secrets.ML_R2_ACCESS_KEY_ID }}
          ML_R2_SECRET_ACCESS_KEY: ${{ secrets.ML_R2_SECRET_ACCESS_KEY }}
          ML_R2_BUCKET_NAME: ${{ secrets.ML_R2_BUCKET_NAME }}
        run: |
          docker run --rm \
            -e ML_DATABASE_URL \
            -e ML_R2_ENDPOINT_URL \
            -e ML_R2_ACCESS_KEY_ID \
            -e ML_R2_SECRET_ACCESS_KEY \
            -e ML_R2_BUCKET_NAME \
            ml-runner:latest \
            ${{ github.event.inputs.league != '' && format('--league "{0}"', github.event.inputs.league) || '' }} \
            --clusters "${{ github.event.inputs.clusters || '6' }}" \
            --tune-iter "${{ github.event.inputs.tune_iter || '30' }}" \
            --test-seasons "${{ github.event.inputs.test_seasons || '1' }}" \
            --min-minutes "${{ github.event.inputs.min_minutes || '800' }}" \
            --seed "${{ github.event.inputs.seed || '42' }}" \
            ${{ github.event.inputs.tune == 'true' && '--tune' || '' }} \
            ${{ github.event.inputs.predict_next == 'true' && '--predict-next' || '' }} \
            ${{ github.event.inputs.fantavoto_csv != '' && format('--fantavoto-csv "{0}"', github.event.inputs.fantavoto_csv) || '' }} \
            --json-logs

      # Fallisce esplicitamente il job (oltre al normale exit code non-zero
      # di run_pipeline.py) così il tab Actions e le notifiche email di
      # GitHub sui watcher del repo segnalano il training fallito.
      - name: Notify on failure
        if: failure()
        run: echo "::error::Training ML fallito — controlla i log sopra. Nessun nuovo run_id è stato promosso."