name: Foreign Stats Backfill

# Backfill storico dei giocatori esteri (leghe non presenti in LEAGUE_CATALOG)
# via scripts/backfill_foreign_stats.py — vedi plan.md sez. 31-32 (PR6).
#
# Idempotente: le unique constraint su leagues/seasons/player_season_stats
# fanno sì che rilanciarlo non produca duplicati (upsert, non insert).
#
# Uso consigliato (rollout progressivo, sez. 30 del piano):
#   1) shadow=true            -> classifica soltanto, nessuna scrittura su DB
#   2) shadow=false, enforce=false -> persiste, soglia solo in warning
#   3) shadow=false, enforce=true  -> persiste, soglia bloccante

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: "Numero di stagioni più recenti (da player_quotations) da scansionare"
        required: false
        default: "2"
      shadow:
        description: "Shadow mode — classifica soltanto, nessuna scrittura su DB (Stage 1)"
        type: boolean
        default: true
      enforce:
        description: "Fallisci la Action se la persistence rate scende sotto la soglia warn (Stage 4)"
        type: boolean
        default: false
      persistence_rate_warn:
        description: "Soglia warning/enforce per la persistence rate (0-1)"
        required: false
        default: "0.90"
      persistence_rate_ok:
        description: "Soglia sopra la quale lo stato è OK (0-1)"
        required: false
        default: "0.95"
      log_level:
        description: "Livello di logging"
        required: false
        default: "INFO"

# Non lanciare due backfill in parallelo sullo stesso DB.
concurrency:
  group: foreign-stats-backfill
  cancel-in-progress: false

jobs:
  backfill:
    name: Foreign players historical backfill
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      ML_DATABASE_URL: ${{ secrets.ML_DATABASE_URL }}
      FOREIGN_SHADOW_MODE: ${{ inputs.shadow }}
      FOREIGN_PERSISTENCE_ENFORCE: ${{ inputs.enforce }}
      FOREIGN_PERSISTENCE_RATE_WARN: ${{ inputs.persistence_rate_warn }}
      FOREIGN_PERSISTENCE_RATE_OK: ${{ inputs.persistence_rate_ok }}
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          set -euo pipefail
          if [ -z "${ML_DATABASE_URL:-}" ]; then
            echo "::error::Secret ML_DATABASE_URL is not set"
            exit 1
          fi
          echo "Required secrets are present."

      - name: Validate workflow inputs
        env:
          RATE_WARN: ${{ inputs.persistence_rate_warn }}
          RATE_OK: ${{ inputs.persistence_rate_ok }}
        run: |
          set -euo pipefail
          case "${{ inputs.seasons }}" in
            ''|*[!0-9]*) echo "::error::seasons must be a positive integer"; exit 1 ;;
          esac
          python - <<'PY'
          import os
          import sys

          for name in ("RATE_WARN", "RATE_OK"):
              raw = os.environ.get(name, "")
              try:
                  val = float(raw)
              except ValueError:
                  print(f"::error::{name} must be a float between 0 and 1, got '{raw}'")
                  sys.exit(1)
              if not (0.0 <= val <= 1.0):
                  print(f"::error::{name} must be between 0 and 1, got {val}")
                  sys.exit(1)

          warn = float(os.environ["RATE_WARN"])
          ok = float(os.environ["RATE_OK"])
          if warn > ok:
              print(f"::error::persistence_rate_warn ({warn}) must be <= persistence_rate_ok ({ok})")
              sys.exit(1)
          PY
          echo "Workflow inputs OK."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ml/requirements.txt
            scraper/requirements.txt

      - name: Install pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml/requirements.txt
          pip install -r scraper/requirements.txt

      - name: Prepare artifacts directory
        run: mkdir -p artifacts

      - name: Baseline counts (pre-backfill)
        run: |
          set -euo pipefail
          python -m scripts.backfill_foreign_stats \
            --db-url "$ML_DATABASE_URL" \
            --baseline \
            --json \
            | tee artifacts/foreign_backfill_baseline_before.json

      - name: Run foreign stats backfill
        id: backfill
        run: |
          set -euo pipefail

          ARGS=(
            --db-url "$ML_DATABASE_URL"
            --seasons "${{ inputs.seasons }}"
            --log-level "${{ inputs.log_level }}"
            --json
          )

          if [ "${{ inputs.shadow }}" = "true" ]; then
            ARGS+=(--shadow)
          fi

          echo "Running: python -m scripts.backfill_foreign_stats ${ARGS[*]}"
          set +e
          python -m scripts.backfill_foreign_stats "${ARGS[@]}" | tee artifacts/foreign_backfill_result.json
          status=${PIPESTATUS[0]}
          set -e

          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Baseline counts (post-backfill)
        if: always()
        run: |
          set -euo pipefail
          python -m scripts.backfill_foreign_stats \
            --db-url "$ML_DATABASE_URL" \
            --baseline \
            --json \
            | tee artifacts/foreign_backfill_baseline_after.json

      - name: Summary
        if: always()
        run: |
          set -euo pipefail
          python - > artifacts/summary.md <<'PY'
          import json

          def load(path):
              try:
                  with open(path, encoding="utf-8") as fh:
                      return json.load(fh)
              except Exception as exc:
                  print(f"::warning::could not read {path}: {exc}")
                  return {}

          result = load("artifacts/foreign_backfill_result.json")
          before = load("artifacts/foreign_backfill_baseline_before.json").get("baseline", {})
          after = load("artifacts/foreign_backfill_baseline_after.json").get("baseline", {})

          fields = [
              "shadow", "seasons", "candidates", "fetched", "persisted",
              "would_persist", "unresolved", "uncatalogued", "skipped_invalid",
              "persistence_rate", "invariant_ok",
          ]

          lines = ["## Foreign Stats Backfill", "", "| metric | value |", "|---|---|"]
          for f in fields:
              lines.append(f"| {f} | {result.get(f)} |")

          if before and after:
              lines += ["", "### Row count deltas", "", "| table | before | after | delta |", "|---|---|---|---|"]
              for k in before:
                  b, a = before.get(k), after.get(k)
                  if isinstance(b, int) and isinstance(a, int):
                      lines.append(f"| {k} | {b} | {a} | {a - b:+d} |")

          print("\n".join(lines))
          PY

          cat artifacts/summary.md
          cat artifacts/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload backfill artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foreign-stats-backfill-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: Notify on failure
        if: failure()
        run: echo "::error::Foreign stats backfill fallito — controlla foreign_backfill_result.json e i log dello step precedente. Se invariant_ok=false è una violazione di conservazione dati, non una semplice soglia."